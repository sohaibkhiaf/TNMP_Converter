<VirtualHost *:80>

    ServerName localhost

    ServerAdmin sohaibkhiaf@gmail.com 


    # ========================================================
    # WSGI
    # ========================================================

    WSGIDaemonProcess tnmp_converter \
        python-path=/var/www/tnmp_converter

    WSGIProcessGroup tnmp_converter

    WSGIApplicationGroup %{GLOBAL}

    WSGIScriptAlias / /var/www/tnmp_converter/tnmp_converter.wsgi


    # ========================================================
    # Flask application
    # ========================================================

    <Directory /var/www/tnmp_converter>

        Require all granted

    </Directory>


    # ========================================================
    # Static files
    # ========================================================

    Alias /static/ /var/www/tnmp_converter/static/

    <Directory /var/www/tnmp_converter/static>

        Require all granted

    </Directory>


    # ========================================================
    # Logs
    # ========================================================

    ErrorLog ${APACHE_LOG_DIR}/tnmp_converter-error.log

    CustomLog ${APACHE_LOG_DIR}/tnmp_converter-access.log combined

</VirtualHost>

